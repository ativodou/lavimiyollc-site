<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mèsi — Fèl an Kreyòl Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sapphire: #0D2A6E;
      --rouge:    #9B1C1C;
      --gold:     #C8891A;
      --cream:    #FAF4E8;
      --ink:      #1A1A1A;
      --muted:    #6B7280;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: 'Jost', sans-serif;
      color: var(--ink);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 40px rgba(13, 42, 110, 0.10);
      padding: 3.5rem 3rem;
      max-width: 520px;
      width: 100%;
    }

    .check-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0D2A6E, #1a3d8f);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
    }

    .check-circle svg {
      width: 36px;
      height: 36px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lang-bar {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
    }

    .lang-btn {
      background: none;
      border: 1px solid var(--sapphire);
      color: var(--sapphire);
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .lang-btn.active, .lang-btn:hover {
      background: var(--sapphire);
      color: #fff;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: var(--sapphire);
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
      margin: 0 auto 1.75rem;
    }

    .impact-line {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--rouge);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .back-btn {
      display: inline-block;
      background: var(--sapphire);
      color: #fff;
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.85; }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.5rem; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('ht')" id="btn-ht">HT</button>
    <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
  </div>

  <div class="check-circle">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>

  <h1 data-ht="Mèsi pou kè ou!" data-en="Thank you!">Mèsi pou kè ou!</h1>
  <div class="divider"></div>

  <p class="subtitle"
     data-ht="Don ou resevwa. Fèl an Kreyòl Inc. ap itilize l pou achte liv ak distribye yo nan lekòl ann Ayiti."
     data-en="Your donation was received. Fèl an Kreyòl Inc. will use it to buy books and distribute them to schools in Haiti.">
    Don ou resevwa. Fèl an Kreyòl Inc. ap itilize l pou achte liv ak distribye yo nan lekòl ann Ayiti.
  </p>

  <p class="impact-line"
     data-ht="Chak dola = yon liv pou yon timoun an Ayiti."
     data-en="Every dollar = a book for a child in Haiti.">
    Chak dola = yon liv pou yon timoun an Ayiti.
  </p>

  <a href="/" class="back-btn" data-ht="Retounen" data-en="Go back">Retounen</a>

  <p class="footer-note"
     data-ht="Fèl an Kreyòl Inc. — òganizasyon san bi likratif, Florida"
     data-en="Fèl an Kreyòl Inc. — nonprofit organization, Florida">
    Fèl an Kreyòl Inc. — òganizasyon san bi likratif, Florida
  </p>
</div>

<script>
  let currentLang = 'ht';

  function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ht]').forEach(el => {
      el.textContent = el.dataset[lang] || el.dataset.ht;
    });
    document.getElementById('btn-ht').classList.toggle('active', lang === 'ht');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  }
</script>
</body>
</html>
